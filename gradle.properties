# Gradle
# Loom 1.19.x requires a Java 25+ JVM to *run* the build tool, while the mod
# itself is compiled to Java 21 bytecode (see options.release in build.gradle).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk-amd64

# Fabric Properties (verified against https://fabricmc.net/develop for 1.21.11)
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
mod_version=1.10.0
maven_group=dev.sevennv
archives_base_name=sevennv

# Dependencies
fabric_api_version=0.141.6+1.21.11
